spring.application.name=multimedia-playlist-api

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/playlist_db?serverTimezone=UTC
# Pongo alias en username y password para tener seguridad, cambiarlos para que funcione.
spring.datasource.username=TU_USUARIO_MYSQL
spring.datasource.password=TU_CONTRASEÑA_MYSQL

# Hibernate crea y actualiza las tablas automáticamente según tus @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true